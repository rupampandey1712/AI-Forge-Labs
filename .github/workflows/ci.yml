name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

# A new push supersedes an in-flight run on the same branch. Without this, a
# busy PR queues five redundant runs and the useful one waits behind them.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.12"
  NODE_VERSION: "22"

jobs:
  # ── Fast feedback: fails in ~40s on a typo, before anything expensive runs ──
  lint:
    name: Lint & format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Install ruff
        run: pip install "ruff>=0.7"

      - name: Ruff lint
        working-directory: backend
        run: ruff check app tests --output-format=github

      - name: Ruff format check
        working-directory: backend
        run: ruff format --check app tests

  # ── Content is the product. A dangling reference must fail the build. ──────
  content:
    name: Content integrity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Install
        working-directory: backend
        run: |
          pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Validate every content pack
        working-directory: backend
        run: python -m app.cli content-check

      - name: OpenAPI schema is in sync
        working-directory: backend
        run: |
          python -m app.cli openapi --out ../openapi.json
          # A drifted schema means the frontend's contract test is checking a
          # fiction. Fail loudly rather than let it rot.
          git diff --exit-code ../openapi.json \
            || (echo "::error::openapi.json is stale — run 'python -m app.cli openapi' and commit it" && exit 1)

  # ── The real suite, against both SQLite and PostgreSQL ────────────────────
  backend-tests:
    name: Backend tests (${{ matrix.database }})
    runs-on: ubuntu-latest
    needs: [lint]
    strategy:
      fail-fast: false
      matrix:
        # SQLite is the zero-setup path a new player uses; PostgreSQL is the
        # deployed one. Both have to work, and they have genuinely different
        # behaviour (JSON containment, ALTER TABLE, timezone handling).
        database: [sqlite, postgres]

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: forge
          POSTGRES_PASSWORD: forge
          POSTGRES_DB: aiforge_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U forge -d aiforge_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 12

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Install
        working-directory: backend
        run: |
          pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Migrations apply, reverse and re-apply
        if: matrix.database == 'postgres'
        working-directory: backend
        env:
          DATABASE_URL: postgresql+asyncpg://forge:forge@localhost:5432/aiforge_test
        run: |
          # A migration that cannot be rolled back is a migration you cannot
          # deploy on a Friday.
          alembic upgrade head
          alembic downgrade base
          alembic upgrade head

      - name: Seed content
        if: matrix.database == 'postgres'
        working-directory: backend
        env:
          DATABASE_URL: postgresql+asyncpg://forge:forge@localhost:5432/aiforge_test
        run: python -m app.cli seed

      - name: Seeding twice is a no-op
        if: matrix.database == 'postgres'
        working-directory: backend
        env:
          DATABASE_URL: postgresql+asyncpg://forge:forge@localhost:5432/aiforge_test
        run: |
          # Re-seeding runs on every deploy. If it is not idempotent it will
          # one day orphan every player's progress.
          python -m app.cli seed
          python -m app.cli stats

      - name: Tests
        working-directory: backend
        env:
          APP_ENV: test
        run: pytest --cov=app --cov-report=term-missing --cov-report=xml -p no:randomly

      - name: Upload coverage
        if: matrix.database == 'sqlite'
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: backend/coverage.xml
          retention-days: 7

  # ── Type checking is separate so a type error does not mask a test failure ─
  typecheck:
    name: mypy (domain + engines)
    runs-on: ubuntu-latest
    needs: [lint]
    continue-on-error: true # advisory: strict only where it pays, see pyproject
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - name: Install
        working-directory: backend
        run: |
          pip install --upgrade pip
          pip install -e ".[dev]"
      - name: mypy
        working-directory: backend
        run: mypy app/game app/domain

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        working-directory: frontend
        run: npm ci --no-audit --no-fund

      - name: Typecheck
        working-directory: frontend
        run: npm run typecheck

      - name: Lint
        working-directory: frontend
        run: npm run lint

      - name: Contract tests
        working-directory: frontend
        run: npm run test

      - name: Build
        working-directory: frontend
        run: npm run build

      - name: Bundle size report
        working-directory: frontend
        run: |
          echo "### Bundle sizes" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          du -h dist/assets/*.js | sort -h | tail -12 >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

  # ── Security: a project that executes untrusted code has to do this ───────
  security:
    name: Security scan
    runs-on: ubuntu-latest
    needs: [lint]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Dependency audit
        working-directory: backend
        run: |
          pip install --upgrade pip pip-audit
          pip install -e .
          # Advisory, not blocking: a transitive CVE with no fix available
          # should not stop a learning project's build, but it must be visible.
          pip-audit --desc || true

      - name: Sandbox invariants
        working-directory: backend
        run: |
          pip install -e ".[dev]"
          # These are the tests that encode the sandbox's security contract.
          # If one fails, untrusted code gained a capability it should not have,
          # or the trust boundary between the game and the sandbox has eroded.
          pytest tests/integration/test_sandbox_security.py \
                 tests/integration/test_sandbox_service.py -p no:randomly -q

      - name: Secret scan
        uses: gitleaks/gitleaks-action@v2
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  docker:
    name: Docker build
    runs-on: ubuntu-latest
    needs: [backend-tests, frontend]
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build backend image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: false
          load: true
          tags: aiforge-backend:ci
          cache-from: type=gha,scope=backend
          cache-to: type=gha,scope=backend,mode=max

      - name: Build frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: false
          load: true
          tags: aiforge-frontend:ci
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,scope=frontend,mode=max

      - name: Build sandbox image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./infra/docker/sandbox.Dockerfile
          push: false
          load: true
          tags: aiforge-sandbox:ci
          cache-from: type=gha,scope=sandbox
          cache-to: type=gha,scope=sandbox,mode=max

      - name: The sandbox image contains no application code
        run: |
          # The whole isolation argument rests on this. Verify it, do not
          # assume it survived a refactor.
          if docker run --rm --entrypoint sh aiforge-sandbox:ci -c "ls /sandbox" 2>/dev/null | grep -qv "runner_main.py"; then
            echo "::error::sandbox image contains files other than runner_main.py"
            docker run --rm --entrypoint sh aiforge-sandbox:ci -c "ls -la /sandbox"
            exit 1
          fi
          echo "✓ sandbox image contains only the standalone runner"

      - name: Build sandbox service image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./infra/docker/sandbox-service.Dockerfile
          push: false
          load: true
          tags: aiforge-sandbox-service:ci
          cache-from: type=gha,scope=sandbox-service
          cache-to: type=gha,scope=sandbox-service,mode=max

      - name: The sandbox service carries no game code and no secrets
        run: |
          # The split is only worth anything if this side genuinely knows
          # nothing. Verify the image, not just the source — a COPY added in a
          # refactor would not show up in the import test.
          leaked=$(docker run --rm --entrypoint sh aiforge-sandbox-service:ci -c \
            "find /srv/app -name '*.py' | grep -Ev '^/srv/app/(__init__|core/(__init__|logging)|sandbox/)' || true")
          if [ -n "$leaked" ]; then
            echo "::error::sandbox service image contains game code:"
            echo "$leaked"
            exit 1
          fi
          # A database driver in this image means someone is one import away
          # from giving the sandbox a connection string.
          if docker run --rm aiforge-sandbox-service:ci \
               python -c "import sqlalchemy" 2>/dev/null; then
            echo "::error::sandbox service image has a database driver installed"
            exit 1
          fi
          echo "✓ sandbox service contains only app.sandbox and has no DB driver"

      - name: The sandbox service works over HTTP
        run: |
          docker run -d --name sandbox             -e SANDBOX_SERVICE_TOKEN=ci-token             -p 8001:8001 aiforge-sandbox-service:ci
          for i in $(seq 1 30); do
            curl -fsS http://localhost:8001/health >/dev/null 2>&1 && break
            sleep 1
          done
          # Same script anyone can run by hand against a local container, so a
          # CI failure here is reproducible in one command rather than being a
          # pile of inline curl only the workflow knows about.
          bash infra/docker/smoke-sandbox.sh http://localhost:8001 ci-token
          docker rm -f sandbox

      - name: The Bicep template compiles and holds its invariants
        run: |
          # No Azure account and no login needed: `bicep build` catches wrong
          # property names and bad API shapes, which is where Bicep bugs live.
          docker run --rm -v "$PWD/infra/azure:/work" -w /work             mcr.microsoft.com/azure-cli:latest bash validate.sh

      - name: Backend image starts and reports healthy
        run: |
          docker run -d --name api \
            -e APP_ENV=development \
            -e SECRET_KEY=ci-only-secret-value-that-is-long-enough-0123456789 \
            -e DATABASE_URL= \
            -e CACHE_ENABLED=false \
            -p 8000:8000 aiforge-backend:ci
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:8000/api/v1/health/live >/dev/null 2>&1; then
              echo "✓ healthy after ${i}s"
              curl -fsS http://localhost:8000/api/v1/health/info
              docker rm -f api
              exit 0
            fi
            sleep 1
          done
          echo "::error::backend image never became healthy"
          docker logs api
          exit 1

  # ── Gate: one required check for branch protection ────────────────────────
  ci-passed:
    name: CI passed
    runs-on: ubuntu-latest
    if: always()
    needs: [lint, content, backend-tests, frontend, security, docker]
    steps:
      - name: Verify every job succeeded
        run: |
          # `needs` does not fail this job when a dependency fails if
          # `if: always()` is set — the result has to be checked explicitly.
          results='${{ join(needs.*.result, ' ') }}'
          echo "Job results: $results"
          for result in $results; do
            if [ "$result" != "success" ]; then
              echo "::error::A required job did not succeed"
              exit 1
            fi
          done
          echo "✓ all checks passed"
