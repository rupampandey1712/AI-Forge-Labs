server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Security headers. The CSP lives HERE, not on the API, because this is the
    # server that actually delivers the HTML the browser executes.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    # 'unsafe-eval' is required by Monaco's worker loader; 'unsafe-inline' by
    # the styles Vite inlines. Both are scoped as tightly as the tooling allows.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-eval' blob:; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self'; worker-src 'self' blob:; frame-ancestors 'none'" always;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Hashed asset filenames are immutable by construction, so cache them hard.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # index.html must NEVER be cached: it is the file that points at the
    # current asset hashes. Caching it is how users get stuck on a stale build.
    location = /index.html {
        add_header Cache-Control "no-store, must-revalidate";
    }

    location /api/ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Sandbox runs and LLM calls can legitimately take a while; the default
        # 60s would cut off a slow submission mid-grade.
        proxy_read_timeout 120s;
        proxy_connect_timeout 10s;
        # WebSocket upgrade, for the live features.
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    # SPA fallback: every unknown path is a client route, not a 404.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
