[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "aiforge-backend"
version = "0.1.0"
description = "AI Forge Labs â€” Python & AI Engineering RPG backend"
requires-python = ">=3.11"
readme = "../README.md"

# â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€
# WHY the split: the web/game core must install in seconds so CI and a first
# `make dev` are fast. Torch + matplotlib + sklearn are ~2GB of wheels and are
# only needed by the ML/DL labs and the sandbox image, so they live in extras.
# â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "pydantic[email]>=2.9",
  "pydantic-settings>=2.5",
  "sqlalchemy[asyncio]>=2.0.35",
  "alembic>=1.13",
  "asyncpg>=0.30",
  "aiosqlite>=0.20",
  "greenlet>=3.0",
  "pyjwt>=2.9",
  "bcrypt>=4.2",
  "python-multipart>=0.0.12",
  "httpx>=0.27",
  "redis>=5.1",
  "structlog>=24.4",
  "orjson>=3.10",
  "numpy>=1.26",
  "pandas>=2.2",
]

[project.optional-dependencies]
ml = [
  "matplotlib>=3.9",
  "scikit-learn>=1.5",
  "torch>=2.4",
]
ai = [
  "langchain>=0.3",
  "langchain-core>=0.3",
  "langgraph>=0.2",
  "langsmith>=0.1",
  "anthropic>=0.39",
]
dev = [
  "pytest>=8.3",
  "pytest-asyncio>=0.24",
  "pytest-cov>=5.0",
  "ruff>=0.7",
  "mypy>=1.13",
  "types-redis",
  "faker>=30.0",
]

[project.scripts]
aiforge = "app.cli:main"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.setuptools.package-data]
app = ["content/**/*.json", "content/**/*.yaml", "content/**/*.py"]

# â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€
[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["alembic/versions"]

[tool.ruff.lint]
select = [
  "E", "F", "W",      # pycodestyle / pyflakes
  "I",                # isort
  "B",                # bugbear
  "UP",               # pyupgrade
  "C4",               # comprehensions
  "SIM",              # simplify
  "ASYNC",            # async correctness â€” critical for this codebase
  "RUF",
]
ignore = [
  "B008",   # FastAPI's Depends() in defaults is idiomatic
  "E501",   # line length handled by the formatter
  "RUF002", # en/em dashes in docstrings are intentional typography here
  "RUF003",
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["B011"]
"app/content/**" = ["E501", "RUF001"]

[tool.ruff.format]
quote-style = "double"

# â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€
[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = [
  "integration: touches the database or the HTTP layer",
  "slow: takes more than a second",
]
filterwarnings = ["ignore::DeprecationWarning:passlib.*"]

# â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€
[tool.mypy]
python_version = "3.11"
plugins = ["pydantic.mypy"]
ignore_missing_imports = true
warn_redundant_casts = true
warn_unused_ignores = false
# Strictness is applied where it pays: the pure-domain game engine.
[[tool.mypy.overrides]]
module = ["app.game.*", "app.domain.*"]
disallow_untyped_defs = true
